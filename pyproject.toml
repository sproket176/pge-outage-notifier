[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pge-outage-notifier"
version = "0.1.0"
description = "Push notifications about PGE power outages (planned and failures) for one locality"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pge-outage-notifier = "pge_outage_notifier.interface.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pge_outage_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["pge_outage_notifier"]
